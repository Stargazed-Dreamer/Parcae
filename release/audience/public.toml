schema_version = 1

# Public audience policy — phase 4 实现（2026-08-10）
#
# 从 v3 的"仅 4 个 workspace 工具组件"升级为"完全开源（除个人数据外全发）"。
# public 受众目标：让 release 产物可以公开发布到 GitHub，供任何人 clone、审计、重建。
#
# phase 4 关键变更（spec-v4-public-full.md）：
#   - components 从 3 个扩展到 10 个（追加 7 个新组件：accounting/dev_toolkit/life_design + 4 个 gacha）
#   - 新增 core_files 段：核心代码（server/client/lib/tools/docs/tests/.agents 等）与 components 并列
#   - 新增 core_files_exclude 段：排除个人规划/IDE 配置/release profiles/产物目录等
#   - core_files 段：核心代码（server/client/lib/tools/docs/tests/.agents 等）与 components 并列
#
# 2026-09-19：friend 受众线已移除，public 是唯一受众。本 audience 关键约束：
#   - components = 10 个（3 个 v3 工具组件 + 7 个 phase 4 新组件）
#   - allow_exemptions = false（不留任何 exemption，个人路径必须由 path_mapping 完全清除）
#   - require_license_clearance = true（需要许可证清关）
#   - static gates 比基础 4 项多 license-clearance + no-agpl-import
#   - build_time gates 比基础 4 项多 sbom-generated
#
# 详见 temp/sdd/release-engine/spec-v4-public-full.md

[audience]
name = "public"
profile = "public-full"
# public 受众允许的组件清单（10 个候选：3 个 v3 工具组件 + 7 个 phase 4 新组件）
# 候选标准：contains_personal_data=false + license_class=apache-2.0 + 通用工具/游戏组件（非个人业务）
# 注：auto_shutdown 已重构为 server/auto_shutdown.py 后端模块（非 workspace 组件），自然包含在 server/ 中，不再单独列为组件
# 注：7 个新组件的 manifest 在 Step 3 创建/修改（license-review 记录 + exports 白名单配置）
components = [
  "disk_manager",
  "recorder",
  "modelscope_model_update",
  "accounting",
  "dev_toolkit",
  "life_design",
  "arknights_gacha",
  "wuwa_gacha",
  "endfield_gacha",
  "yihuan_gacha",
]
# 使用每组件的 exports.source.files（含源码 + 测试 + 文档）
export_set = "source"
# public 受众不允许敏感内容豁免（个人路径必须由 path_mapping 清除，不留 exemption）
allow_exemptions = false
# public 受众需要许可证清关（license-clearance gate）
require_license_clearance = true

# spec-v4 决策 G1/G14：core_files 是核心代码 glob 清单，与 components 的 manifest.exports glob 并列，
# 共同展开为 file_entries。core_files_exclude 是排除 glob 清单，与 .gitignore 语义类似。
# core_files / core_files_exclude 的划分原则见 spec-v4 G5 决策。
core_files = [
  # 核心代码目录
  "server/**",
  "client/**",
  "lib/**",
  "tools/**",
  "docs/**",
  "tests/**",
  ".agents/skills/**",
  ".agents/rules/**",
  ".github/workflows/**",

  # release 配置（audience/ 保留；profiles/ 排除）
  "release/audience/**",
  "release/templates/**",
  # 依赖映射表/审计报告（dependency_map.toml / dependency_audit.json）不进包：发布引擎无任何消费方，
  # 且产物逐条列出未进包的私有 workspace 模块路径。2026-09-17 起生成到 temp/release_deps/

  # 根目录配置文件（start*.bat 不含个人路径，已确认）
  "AGENTS.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE.md",
  "README_public.md",
  "SECURITY-RISKS.md",
  "config.example.toml",
  "pyproject.toml",
  "tools_manifest.json",
  ".gitignore",
  ".python-version",
  "uv.lock",
  "start.bat",
  "start_approval_panel.bat",
  "start_client.bat",
]

core_files_exclude = [
  # 测试文件（内部组件专用测试 + 依赖 policy.toml 的 v2 测试 + release-engine v4 自测，公开版无意义/不含 policy.toml/release-engine 内部实现）
  # 注：tests/test_release_v4.py 故意构造敏感样本验证 scanner 排除逻辑，
  # scanner 不区分测试代码，必须从发布包排除（与 test_gh_mirror_release.py 同性质处理）
  "tests/release_ci/test_gh_mirror_release.py",
  "tests/release_ci/test_release_policy.py",
  "tests/release_ci/test_release_v4.py",

  # 源仓库 README（公开版用 README_public.md → README.md，build 期 path_renames 处理）
  "README.md",

  # 内部发布策略管控件（2026-09-19 补）：描述私有模块排除清单、私有功能决策与个人路径，
  # 按该文件自身声明"不应分发"。M0 阶段曾排除，v4 改用 core_files 结构时规则丢失，
  # 而 core_files 含 docs/** 会导致它被打进 public 包 —— 此处补回。
  "docs/release-policy.md",

  # 个人待办（含个人开发笔记：股票面板、卡池可视化等）
  "todo.txt",

  # 个人规划（git ls-files 确认被跟踪：github-app-bot/internal-workflow/v6 设计文档等）
  "planning_notes/**",

  # IDE 配置（.trae/rules/project_rules.md 与 .agents/rules/project_rules.md 重复）
  ".trae/**",
  ".codebuddy/**",

  # 第三方配置（.dcg/ 目录 + .dcg.toml 配置文件一致排除）
  ".dcg/**",
  ".dcg.toml",

  # release v1 遗留（G18 调整：保留作为不变量声明，但公开版不含）
  "release/policy.toml",

  # release profiles（"别人拿去还是坏处多"）
  "release/profiles/**",

  # release 产物目录（空目录/构建产物，不应进入公开版）
  "release/dist/**",
  "release/plans/**",
  "release/staging/**",

  # 发布 CI workflow（2026-09-19 补）：该 workflow 在 public 仓必然失败——它需要
  #   (a) release/profiles/public-full.toml（被 release/profiles/** 排除，且文件内含个人路径映射）
  #   (b) pyproject.toml 的 optional-dependencies（项目当前不存在该段）
  #   (c) 在 ubuntu-latest 上 uv sync（pywin32/uiautomation/paddlepaddle-gpu 无平台标记，Linux 装不上）
  # 一旦进包，public 仓每次 push 都会显示红色 ✗，对 clone 用户是劝退信号。
  ".github/workflows/release-public.yml",

  # .agents WIP（工作进行中笔记，个人维护用）
  ".agents/wip/**",

  # 个人系统重建内容（个人路径密集，2026-07-18 决策起即排除；2026-09-12
  # triage 核对确认仍有 100+ 行本机路径残留）
  "workspace/disk_manager/system_rebuild/**",

  # 磁盘清理的个人待删决策台账（2026-09-28 决策起排除）。manifest 用
  #   `workspace/disk_manager/**` 全拿，会把这份一并带进包；实测内容含真机盘符
  #   目录、逐条目体积、"等到学期末再清"这类生活语境与反问话术原话，以及一条
  #   带 Windows 账号名的沙箱路径。对外没有任何价值（接收人没有这些盘），
  #   纯个人数据——按"排除比脱敏更省事也更可靠"处理。
  #   脱敏引擎仍在包里：SKILL.md / loop_actions.py / manifest.toml 照常发布。
  "workspace/disk_manager/pending_decisions.md",

  # --- 2026-11-03 发布范围收窄（用户"全按默认"确认，对应 57 组分诊里的 4 项）---
  # 判据统一是「收包人拿这份东西能不能用」，不是「里面有没有个人路径」(路径能脱敏)。
  #
  # 磁盘 I/O 取证报告：记录的是"这台机器那天为什么读写了 9.8GB"——SRUM 数据库导出、
  #   逐进程小时级时间线、NVMe SMART 快照。收包人没有这套库也没有那天的现场，
  #   拿到既跑不起来也无处对照；脚本里还写着本机盘符与进程名。属纯个人取证。
  #   目录级排除而非逐个文件：将来同类突发归因报告也是同一性质。
  "workspace/disk_manager/reports/**",
  # VM 磁盘空间分析（单文件）：同样是"我这台机器还剩多少空间"的一次性结论。
  "workspace/disk_manager/VM_SPACE_ANALYSIS.md",
  # 磁盘 I/O 排查交接单：写给"接手这台机器的人"的备忘录，含真机盘符与进度状态。
  "workspace/disk_manager/DISK_IO_HANDOVER.md",
  # 群聊就业情报导入 skill：描述的是把群聊里看到的招聘信息整理进个人求职档案，
  #   依赖私有 Future 工作区的目录约定；且正文含私聊内容的分类口径。
  #   对外没有可复用价值（别人没有那套档案结构），隐私面最大的一项。
  ".agents/skills/daily/future-group-intel-import/**",
]

[audience.gates]
# 静态 gates（prepare_release 跑，失败不产 plan）
# 基础 4 个 + public 专属 2 个 = 6 个
static = [
  "policy-schema",
  "tracked-file-inventory",
  "sensitive-content-scan",
  "manifest-audit",
  "license-clearance",       # public 专属
  "no-agpl-import",          # public 专属
]
# 构建期 gates（build_release 跑，失败 .failed.zip 留 staging）
# 基础 4 个 + public 专属 1 个 = 5 个
build_time = [
  "compile-check",
  "activity-task-safe-stop",
  "focused-tests",
  "archive-verification",
  "sbom-generated",          # public 专属
]
