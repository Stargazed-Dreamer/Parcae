[component]
name = "disk_manager"
version = "0.4.0"
description = "磁盘空间分析与清理建议（含 SpaceSniffer 快照导入）、系统环境全面备份（浏览器/游戏存档/桌面/系统设置/文件关联，含 assoc_snapshot/diff/restore 三件套）、设置看门狗引擎（settings_watch/watch.py 统一 snapshot/diff/restore，纳管文件关联·PATH/环境变量·默认浏览器/URL协议·开机自启·Winlogon登录劫持）、迁移易漏四组导出（backup_groups.py：凭据/外观/系统策略/开发工具配置，全量备份自动跑）"
project_tag = "disk_manager"
enabled = true

[exports.runtime]
files = ["workspace/disk_manager/**"]

[exports.source]
# f10-b：删除 tests/test_disk_manager*.py glob（测试文件未创建，glob 永远不命中 → drift_detector G 节 MEDIUM）
files = ["workspace/disk_manager/**"]

[release_facts]
contains_personal_data = false
requires_external_credentials = false
# 2026-07-31 T05a: 升级为 apache-2.0（移除 system_rebuild/ 中的 JetBrains 破解内容后审查通过）
# 审查记录：temp/sdd/release-engine/license-review/disk_manager.md
license_class = "apache-2.0"

[agent_guide]
file = "loop_actions.py"
entries_var = "GUIDE_REGISTRY_ENTRIES"

[skill]
file = "SKILL.md"
task_type = "adhoc.disk_cleanup"
index_section = "components"

[watch]
paths = ["scripts/scan_disk.py", "scripts/cleanup.py", "scripts/backup_env.py", "scripts/parse_sns.py", "references/sns_format.md", "scan/", "system_rebuild/manifest.json"]

[tests]
# 自动化测试声明：测试套件（run_all.py）扫描本段自动收集组件测试
enabled = true
paths = ["tests"]
